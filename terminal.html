<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL // SIGMA CALIBRATION</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .crt { width: 600px; padding: 40px; border: 1px solid #00ff41; position: relative; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); }
        .crt::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: 2; background-size: 100% 3px, 3px 100%; pointer-events: none; }
        h2 { border-bottom: 1px solid #00ff41; padding-bottom: 10px; font-size: 1.2rem; }
        .input-group { margin: 25px 0; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; letter-spacing: 1px; color: #008f11; }
        input { background: transparent; border: 1px solid #00ff41; color: #00ff41; width: 100%; padding: 12px; box-sizing: border-box; outline: none; font-family: inherit; font-size: 1.1rem; }
        button { background: #00ff41; color: #000; border: none; padding: 15px; width: 100%; margin-top: 25px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1rem; }
        button:hover { background: #fff; }
        .hint-text { font-size: 0.7rem; color: #004400; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <!-- 
        GROUND_STATION_METADATA:
        ALPHA -> EPSILON -> DELTA -> BETA
    -->
    <div class="crt">
        <h2>SPECTRAL DE-SCRAMBLER v.1.1</h2>
        <p style="font-size: 0.8rem;">RECOVERY TARGET: FRACTAL-6 // SIGMA_SET_01</p>
        
        <div class="input-group">
            <label>RAW COORDINATES:</label>
            <input type="text" id="sigma" placeholder="00000000000000000000" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label>KEY:</label>
            <input type="text" id="offset" placeholder="XXXX" autocomplete="off">
        </div>
        
        <button onclick="calibrate()">STABILIZE SIGNAL</button>
        <p class="hint-text">SECURE PHASE-LOCK REQUIRED FOR DATA ACCESS</p>
    </div>

    <script>
        function calibrate() {
            const s = document.getElementById('sigma').value.trim();
            const o = document.getElementById('offset').value.trim();
            if (s === "28349682734908572309" && o === "1624") {
                alert("SIGNAL STABILIZED. REDIRECTING TO SECURE DATA NODE.");
                window.location.href = "victory.html";
            } else {
                alert("STABILIZATION FAILURE: PHASE MISMATCH. RE-CHECK HARDWARE OFFSET.");
            }
        }
    </script>
</body>
</html>
